# cargo-fuzz / ClusterFuzzLite harness for lignite.
#
# Standalone crate (note the [workspace] table), so it is NOT built by
# `cargo build` / `cargo test` in the parent repository. It is built by
# ClusterFuzzLite (see ../.clusterfuzzlite/) and locally by cargo-fuzz:
#
#     cargo install cargo-fuzz
#     cargo +nightly fuzz run db_differential_fuzzer
#     cargo +nightly fuzz run sstable_parse_fuzzer
#     cargo +nightly fuzz run wal_parse_fuzzer

[package]
name = "lignite-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.lignite]
path = ".."

[[bin]]
name = "db_differential_fuzzer"
path = "fuzz_targets/db_differential_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sstable_parse_fuzzer"
path = "fuzz_targets/sstable_parse_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_parse_fuzzer"
path = "fuzz_targets/wal_parse_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_codec_fuzzer"
path = "fuzz_targets/block_codec_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_parse_fuzzer"
path = "fuzz_targets/archive_parse_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "version_edit_fuzzer"
path = "fuzz_targets/version_edit_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "write_batch_fuzzer"
path = "fuzz_targets/write_batch_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wal_recover_fuzzer"
path = "fuzz_targets/wal_recover_fuzzer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sstable_seek_fuzzer"
path = "fuzz_targets/sstable_seek_fuzzer.rs"
test = false
doc = false
bench = false

# Standalone: do not attempt to join the parent package's (absent) workspace.
[workspace]
